services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: msme_billing
      POSTGRES_USER: msme
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - msme_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msme -d msme_billing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  msme_postgres_data:
