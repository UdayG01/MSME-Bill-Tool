services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: msme_billing
      MARIADB_USER: msme
      MARIADB_PASSWORD: local_dev_only
      MARIADB_ROOT_PASSWORD: local_root_dev_only
    ports:
      - "3306:3306"
    volumes:
      - msme_mariadb_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  msme_mariadb_data:
